ktor:
  application:
    modules:
      - ApplicationKt.module
  deployment:
    port: 8081

jwt:
  secret: ${JWT_SECRET}
  issuer: "melisma"
  audience: "melisma-app"

database:
  url: ${DATABASE_URL}
  user: ${DATABASE_USER}
  password: ${DATABASE_PASSWORD}

storage:
  endpoint: ${S3_ENDPOINT}
  accessKey: ${S3_ACCESS_KEY}
  secretKey: ${S3_SECRET_KEY}
  region: ${S3_REGION}
  bucket: ${S3_BUCKET}
